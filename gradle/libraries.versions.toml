[versions]
champeau-jmh = "0.7.3"
jmh = "1.37"
jupiter = "5.13.4"

[plugins]
champeau-jmh = { id = "me.champeau.jmh", version.ref = "champeau-jmh" }

[libraries]
jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "jupiter" }
jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "jupiter" }
jmh-core = { module = "org.openjdk.jmh:jmh-core", version.ref = "jmh" }
jmh-annprocess = { module = "org.openjdk.jmh:jmh-generator-annprocess", version.ref = "jmh" }
jmh-bytecode = { module = "org.openjdk.jmh:jmh-generator-bytecode", version.ref = "jmh" }

[bundles]
jupiter = ["jupiter-engine", "jupiter-params"]
jmh = ["jmh-core", "jmh-annprocess", "jmh-bytecode"]
